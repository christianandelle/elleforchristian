<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Baby ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffeef5);
    font-family:Georgia,serif;
    overflow:hidden;
}

.card{
    background:white;
    padding:50px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    text-align:center;
    max-width:650px;
}

h1{
    color:#ff4d88;
}

p{
    font-size:20px;
    line-height:1.7;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:30px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff2d73;
}

.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 6s linear infinite;
    opacity:.5;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
}
100%{
transform:translateY(-100px) scale(1.2);
}
}
</style>

</head>

<body>

<div class="card">

<h1>Hello, Baby ❤️</h1>

<p>
Turns out a heart doesn't have to be whole
to love completely.
</p>

<p>
Stay safe, always.
</p>

<button onclick="showLetter()">
Open My Letter
</button>

</div>

<script>

function showLetter(){

document.body.innerHTML=`

<div class="card">

<h1>My Letter 💌</h1>

<p>

I just wanted to remind you
how proud I am of you.

Every page you study,
every hour you spend reviewing,
brings you one step closer to
becoming a Customs Broker.

No matter what happens,

I'll always believe in you.

Stay safe, baby.

Always.

❤️

</p>

</div>

`;

}

for(let i=0;i<35;i++){

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.className="heart";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*6)+"s";

heart.style.fontSize=(15+Math.random()*30)+"px";

heart.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
