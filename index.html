<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Baby ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Stars -->
<div id="stars"></div>

<!-- Envelope Page -->

<div id="envelopePage">

    <div class="envelope-container">

        <div class="envelope">

            <div class="top"></div>

            <div class="bottom"></div>

            <div class="letter-preview">

                <h2>To Christian.</h2>

                <p>
                    Some letters are worth waiting for.
                </p>

            </div>

            <div class="seal" onclick="openLetter()">

                ❤️

            </div>

        </div>

        <p class="instruction">
            Click the heart to open your letter.
        </p>

    </div>

</div>

<!-- Letter -->

<div id="letterPage">

<div class="paper">

<h1>My dearest Christian,</h1>

<div id="letterContent">

<!--
YOUR LETTER WILL GO HERE
-->

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
